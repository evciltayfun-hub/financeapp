[deploy]
# exec so `next` is PID 1 and shuts down cleanly on SIGTERM during redeploys
startCommand = "export DATABASE_URL=${DATABASE_URL:-file:/app/data/dev.db} && mkdir -p /app/data && npx prisma migrate deploy && exec ./node_modules/.bin/next start -p ${PORT:-3000}"
healthcheckPath = "/login"
healthcheckTimeoutSecs = 30
